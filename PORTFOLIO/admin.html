<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Portfolio Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="shield-check" class="text-sky-500"></i> Admin Portfolio Manager
                </h1>
                <p class="text-slate-400 text-xs mt-1">Add projects and certifications directly to your database.</p>
            </div>
            <a href="index.html" class="text-xs text-slate-400 hover:text-sky-400 transition">&larr; View Site</a>
        </div>

        <!-- Global Security Key -->
        <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Admin Security Key</label>
            <input type="password" id="adminPassword" placeholder="Enter security password" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition">
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 text-sm font-medium">
            <button id="tabProjectBtn" type="button" class="flex-1 py-2.5 text-center text-sky-400 border-b-2 border-sky-500 focus:outline-none transition">
                Add Project
            </button>
            <button id="tabCertBtn" type="button" class="flex-1 py-2.5 text-center text-slate-400 hover:text-white focus:outline-none transition">
                Add Certification
            </button>
        </div>

        <!-- 1. Add Project Form -->
        <form id="projectForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Project Title</label>
                <input type="text" id="projTitle" placeholder="e.g. Customer Churn Predictor" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Description</label>
                <textarea id="projDesc" rows="3" placeholder="Brief summary of architecture, algorithms, and key findings..." required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Tech Stack (Comma Separated)</label>
                <input type="text" id="projTech" placeholder="Python, XGBoost, FastAPI, Docker" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Live Demo URL</label>
                    <input type="url" id="projDemo" placeholder="https://..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">GitHub URL</label>
                    <input type="url" id="projGithub" placeholder="https://github.com/..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-sky-500 text-slate-100 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-lg transition shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
                <i data-lucide="plus-circle" class="w-5 h-5"></i> Publish Project
            </button>
        </form>

        <!-- 2. Add Certification Form (Hidden by default) -->
        <form id="certForm" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Certification / Course Title</label>
                <input type="text" id="certTitle" placeholder="e.g. NPTEL Business Intelligence & Analytics" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Issuer / Organization</label>
                <input type="text" id="certIssuer" placeholder="e.g. NPTEL / IIT" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Description</label>
                <textarea id="certDesc" rows="3" placeholder="Overview of key subjects covered and concepts learned..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 transition"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Credential URL (Optional)</label>
                <input type="url" id="certUrl" placeholder="https://..." class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg focus:outline-none focus:border-emerald-500 text-slate-100 transition">
            </div>

            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg transition shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2">
                <i data-lucide="award" class="w-5 h-5"></i> Publish Certification
            </button>
        </form>
    </div>

    <script>
        // Initialize Lucide Icons
        if (window.lucide) {
            lucide.createIcons();
        }

        // Tab Switching Elements
        const tabProjectBtn = document.getElementById('tabProjectBtn');
        const tabCertBtn = document.getElementById('tabCertBtn');
        const projectForm = document.getElementById('projectForm');
        const certForm = document.getElementById('certForm');

        tabProjectBtn.addEventListener('click', () => {
            projectForm.classList.remove('hidden');
            certForm.classList.add('hidden');
            tabProjectBtn.className = "flex-1 py-2.5 text-center text-sky-400 border-b-2 border-sky-500 focus:outline-none transition";
            tabCertBtn.className = "flex-1 py-2.5 text-center text-slate-400 hover:text-white focus:outline-none transition";
        });

        tabCertBtn.addEventListener('click', () => {
            certForm.classList.remove('hidden');
            projectForm.classList.add('hidden');
            tabCertBtn.className = "flex-1 py-2.5 text-center text-emerald-400 border-b-2 border-emerald-500 focus:outline-none transition";
            tabProjectBtn.className = "flex-1 py-2.5 text-center text-slate-400 hover:text-white focus:outline-none transition";
        });

        // Helper function for POST requests
        async function postData(endpoint, payload, form) {
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();

                if (res.ok) {
                    alert('Successfully published!');
                    form.reset();
                } else {
                    alert(`Error: ${result.error || 'Failed to submit'}`);
                }
            } catch (err) {
                alert('Connection error: Make sure server.js is running.');
            }
        }

        // Project Submission Event
        projectForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            
            if (!password) {
                alert('Please enter your Admin Security Key at the top.');
                return;
            }

            const payload = {
                adminPassword: password,
                title: document.getElementById('projTitle').value,
                desc: document.getElementById('projDesc').value,
                tech: document.getElementById('projTech').value,
                demoUrl: document.getElementById('projDemo').value,
                githubUrl: document.getElementById('projGithub').value
            };

            postData('/api/projects', payload, projectForm);
        });

        // Certification Submission Event
        certForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;

            if (!password) {
                alert('Please enter your Admin Security Key at the top.');
                return;
            }

            const payload = {
                adminPassword: password,
                title: document.getElementById('certTitle').value,
                issuer: document.getElementById('certIssuer').value,
                desc: document.getElementById('certDesc').value,
                credentialUrl: document.getElementById('certUrl').value
            };

            postData('/api/certifications', payload, certForm);
        });
    </script>
</body>
</html>
